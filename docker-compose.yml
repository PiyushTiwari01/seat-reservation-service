services:
  db:
    image: postgres:16
    container_name: seat_reservation_db
    environment:
      POSTGRES_DB: seatdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seatdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: seat_reservation_api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/seatdb
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data: